- name: update apt cache
  apt: update_cache=yes

- name: Install system packages
  apt:
    pkg: "{{apt_default_packages + apt_extra_packages}}"
    state: latest
  become: true

- name: set services to start on boot
  service:
    name: "{{item}}"
    enabled: yes
    state: started
  with_items:
    - chrony
    - supervisor
    - redis-server

- name: set vim as default editor
  command: update-alternatives --set editor /usr/bin/vim.basic
  changed_when: false

- name: configure localtime
  file:
    src: /usr/share/zoneinfo/{{ system.timezone }}
    dest: /etc/localtime
    owner: root
    group: root
    mode: 644
    state: link
    force: yes
  register: server_timezone

- name: update timezone
  command: dpkg-reconfigure --frontend noninteractive tzdata
  when: server_timezone.changed

- name: update redis configuration
  lineinfile:
    dest: /etc/redis/redis.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  with_items:
    - { regexp: '^bind 127.0.0.1', line: 'bind 0.0.0.0' }

- name: update chrony configuration
  lineinfile:
    dest: /etc/chrony/chrony.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  with_items:
    - { regexp: '^makestep', line: 'makestep 1 -1' }

- name: Keep Vagrant NFS shares alive
  copy:
    dest: "/etc/systemd/system/vagrant-share-keepalive.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Keep Vagrant NFS shares alive
      After=multi-user.target

      [Service]
      Type=simple
      ExecStart=/bin/bash -c 'while true; do echo "Checking {{ vagrantfile.synced_folder.target }}"; ls {{ vagrantfile.synced_folder.target }} >/dev/null 2>&1; sleep 30; done'

      Restart=always
      RestartSec=5
      User=vagrant

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  command: systemctl daemon-reload

- name: Enable and start keep-alive service
  service:
    name: "vagrant-share-keepalive"
    enabled: yes
    state: started

- name: Trust repositories
  command: git config --system --add safe.directory '*'

- name: restart services
  service:
    name: "{{ item }}"
    state: restarted
  with_items:
    - chrony
    - supervisor
    - redis-server
    - vagrant-share-keepalive
