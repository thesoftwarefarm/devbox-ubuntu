- name: create vhost config for {{vhost.name}}
  template:
    src: "{{system.web_server}}.conf"
    dest: /etc/nginx/conf.d/{{vhost.name}}.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: create supervisor config for {{vhost.name}}
  template:
    src: supervisor.conf
    dest: /etc/supervisor/conf.d/{{vhost.name}}.conf
    owner: root
    group: root
    mode: 0644
  when: vhost.supervisor is defined and vhost.supervisor.commands is defined
  notify:
    - restart supervisor

- name: create /etc/hosts entries for {{vhost.name}}
  lineinfile:
    dest: /etc/hosts
    line: "127.0.0.1 {{vhost.domains | join(' ')}}"
    state: present
